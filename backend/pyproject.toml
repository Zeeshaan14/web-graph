[project]
name = "web-graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "markdownify>=1.2.3",
    "playwright>=1.62.0",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "network: hits a real site or launches a real browser (excluded by default; run with -m network)",
]
addopts = "-m 'not network'"
